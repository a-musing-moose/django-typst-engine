StylesPath = .styles
MinAlertLevel = suggestion
Vocab = jargon
Packages = proselint, Microsoft

[*]
; Disable for all file types
BasedOnStyles =

[*.md]
; Enable for just mardown files
BasedOnStyles = proselint, Vale, Microsoft
Microsoft.GeneralURL = NO
Microsoft.Passive = NO
; Skip zensical/mkdocs-macros template calls, e.g. {{ json_schema("...") }} -
; these are template syntax, not prose, and get misread as sentences.
BlockIgnores = (?s)(\{\{.+?\}\})
